name: Build and Distribute to Firebase App Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Release AAB
      run: ./gradlew bundleRelease -x test --no-daemon

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Distribute to Firebase App Distribution
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}
      run: |
        set -e
        if [ -z "$FIREBASE_TOKEN" ] || [ -z "$FIREBASE_APP_ID" ]; then
          echo "Missing FIREBASE_TOKEN or FIREBASE_APP_ID secrets"; exit 1
        fi
        FILE=app/build/outputs/bundle/release/app-release.aab
        if [ ! -f "$FILE" ]; then
          echo "Bundle not found at $FILE"; ls -R app/build || true; exit 2
        fi
        CMD=(firebase appdistribution:distribute "$FILE" --app "$FIREBASE_APP_ID" --token "$FIREBASE_TOKEN")
        if [ -n "$FIREBASE_GROUPS" ]; then
          CMD+=(--groups "$FIREBASE_GROUPS")
        fi
        echo "Running: ${CMD[*]}"
        "${CMD[@]}"
